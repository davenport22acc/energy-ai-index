name: lake-ci

# Runs the three Fabric notebooks end to end on a tiny fixture (two months),
# with the same Spark and Delta versions as Fabric Runtime 1.3.
on:
  pull_request:
    paths: ["fabric/**", "scripts/run_notebook.py", "tests/**", ".github/workflows/lake-ci.yml"]
  push:
    branches: [main]
    paths: ["fabric/**", "scripts/run_notebook.py", "tests/**", ".github/workflows/lake-ci.yml"]
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAKE_ROOT: ${{ github.workspace }}/lake
      SPARK_DRIVER_MEMORY: 2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pyspark==3.5.3" "delta-spark==3.2.1" lxml pyarrow requests
      - name: Shared setup cell identical in all notebooks
        run: python tests/check_setup_cells.py
      - name: Build fixtures
        run: python tests/make_mastr_fixture.py fixtures
      - name: Month 1
        run: |
          python scripts/run_notebook.py fabric/01_bronze_mastr.Notebook --param MASTR_ZIP=fixtures/Gesamtdatenexport_20261101.zip --param LOAD_DATE='"20261101"'
          python scripts/run_notebook.py fabric/02_silver_units.Notebook --param LOAD_DATE='"20261101"'
          python scripts/run_notebook.py fabric/03_gold_pipeline.Notebook
      - name: Month 2
        run: |
          python scripts/run_notebook.py fabric/01_bronze_mastr.Notebook --param MASTR_ZIP=fixtures/Gesamtdatenexport_20261201.zip --param LOAD_DATE='"20261201"'
          python scripts/run_notebook.py fabric/02_silver_units.Notebook --param LOAD_DATE='"20261201"'
          python scripts/run_notebook.py fabric/03_gold_pipeline.Notebook
      - name: Rerun month 2 (idempotent)
        run: |
          python scripts/run_notebook.py fabric/01_bronze_mastr.Notebook --param MASTR_ZIP=fixtures/Gesamtdatenexport_20261201.zip --param LOAD_DATE='"20261201"'
          python scripts/run_notebook.py fabric/02_silver_units.Notebook --param LOAD_DATE='"20261201"'
          python scripts/run_notebook.py fabric/03_gold_pipeline.Notebook
      - name: Check lake
        run: python tests/check_lake.py
