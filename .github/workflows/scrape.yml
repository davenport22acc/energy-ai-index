name: scrape

on:
  schedule:
    - cron: "17 4 * * *"   # daily 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Detect careers page and ATS per company
        run: python -m eaix.ingest.ats_detect data/seed/companies.csv
      - name: Commit results
        run: |
          git config user.name "eaix-bot"
          git config user.email "eaix-bot@users.noreply.github.com"
          git add data/seed/companies.csv data/reports/
          git diff --cached --quiet || git commit -m "ATS detection run $(date -u +%F)"
          git push
