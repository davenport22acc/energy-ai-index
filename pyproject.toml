[project]
name = "energy-pipeline-radar"
version = "0.2.0"
description = "Energy Pipeline Radar: wind, PV and storage pipeline plus BESS siting for AT, DE, IT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "tabulate>=0.9",
  "open-mastr>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
